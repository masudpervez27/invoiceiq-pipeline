[project]
name = "invoiceiq-pipeline"
version = "0.1.0"
description = "InvoiceIQ Pipeline"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
